<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA MASIVO DE ANÁLISIS VERBAL</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: auto; background: #1a1a1a; padding: 30px; border-radius: 15px; border: 2px solid #333; }
        h1 { color: #00d4ff; text-transform: uppercase; letter-spacing: 2px; }
        .verb-card { background: #000; padding: 40px; border-radius: 10px; margin: 20px 0; border: 1px solid #00d4ff; }
        .word { font-size: 4rem; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .hint { color: #888; margin-bottom: 30px; font-style: italic; }
        .question { font-size: 1.5rem; color: #f1c40f; margin-bottom: 20px; }
        input { width: 80%; padding: 15px; font-size: 1.2rem; border-radius: 5px; border: none; margin-bottom: 20px; text-align: center; }
        button { padding: 15px 40px; font-size: 1.2rem; cursor: pointer; border: none; border-radius: 5px; transition: 0.3s; font-weight: bold; }
        .btn-check { background: #00d4ff; color: #000; }
        .btn-next { background: #333; color: #fff; display: none; }
        #feedback { margin: 20px; font-size: 1.3rem; font-weight: bold; padding: 15px; border-radius: 5px; display: none; }
        .score { font-size: 1.2rem; color: #00ff88; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Analizador de Verbos Pro</h1>
    <div class="score">Puntos: <span id="score">0</span></div>

    <div class="verb-card">
        <div id="hint" class="hint">Cargando...</div>
        <div id="word" class="word">---</div>
        <div id="question" class="question">---</div>
        <input type="text" id="ans" placeholder="Escribe tu respuesta..." autocomplete="off">
        <br>
        <button id="btn-check" class="btn-check" onclick="check()">Verificar</button>
        <button id="btn-next" class="btn-next" onclick="next()">Siguiente Verbo</button>
    </div>
    
    <div id="feedback"></div>
</div>

        {inf: "Servir", pal: "Sirviera", cat: "modo", res: "subjuntivo"},
        {inf: "Vestir", pal: "Vestido", cat: "aspecto", res: "perfectivo"},
        {inf: "Divertir", pal: "Divirtiendo", cat: "tiempo", res: "gerundio"},
        {inf: "Preferir", pal: "Prefieres", cat: "persona", res: "2a"},
        {inf: "Sentir", pal: "Sentimos", cat: "persona", res: "1a"},
        {inf: "Mentir", pal: "Mintió", cat: "numero", res: "singular"},
        {inf: "Hervir", pal: "Hirviera", cat: "modo", res: "subjuntivo"}
    ];

    let current = 0;
    let score = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    shuffle(data);

    function load() {
        const item = data[current];
        document.getElementById('hint').innerText = "Infinitivo: " + item.inf;
        document.getElementById('word').innerText = item.pal;
        document.getElementById('question').innerText = "¿Cuál es su " + item.cat.toUpperCase() + "?";
        document.getElementById('ans').value = "";
        document.getElementById('ans').disabled = false;
        document.getElementById('feedback').style.display = "none";
        document.getElementById('btn-check').style.display = "inline-block";
        document.getElementById('btn-next').style.display = "none";
        document.getElementById('ans').focus();
    }

    function check() {
        const user = document.getElementById('ans').value.toLowerCase().trim();
        const correct = data[current].res.toLowerCase();
        const f = document.getElementById('feedback');
        
        f.style.display = "block";
        if (user === correct) {
            f.innerText = "¡CORRECTO!";
            f.style.background = "#00ff8822";
            f.style.color = "#00ff88";
            score += 10;
        } else {
            f.innerText = "ERROR. La respuesta era: " + correct.toUpperCase();
            f.style.background = "#ff313122";
            f.style.color = "#ff3131";
        }

        document.getElementById('score').innerText = score;
        document.getElementById('ans').disabled = true;
        document.getElementById('btn-check').style.display = "none";
        document.getElementById('btn-next').style.display = "inline-block";
    }

    function next() {
        current++;
        if (current >= data.length) {
            alert("¡Has terminado el banco de datos!");
            current = 0;
            shuffle(data);
        }
        load();
    }

    document.getElementById('ans').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') {
            if(document.getElementById('btn-check').style.display !== 'none') check();
            else next();
        }
    });

    load();
