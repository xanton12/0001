<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbos</title>
    <style>
        :root {
            --primary: #00f2fe; --secondary: #4facfe;
            --bg: #0b0e14; --card: #161b22;
            --text: #e6edf3; --accent: #f1c40f;
            --success: #2ecc71; --error: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .app-container { width: 100%; max-width: 550px; padding: 20px; }
        
        .glass-card {
            background: var(--card); border-radius: 28px; padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        h1 { 
            background: linear-gradient(90deg, var(--primary), var(--secondary)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            font-size: 2.5rem; margin: 0 0 10px 0; font-weight: 800;
        }

        .section-label { color: #8b949e; font-size: 0.8rem; margin-top: 20px; text-transform: uppercase; letter-spacing: 1.5px; }

        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .difficulty-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 15px 0; }

        .option {
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px;
            display: flex; align-items: center; cursor: pointer; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem;
        }
        .option:hover { background: rgba(255,255,255,0.08); }
        .option input { display: none; }
        .dot { height: 12px; width: 12px; border-radius: 50%; border: 2px solid var(--secondary); margin-right: 10px; flex-shrink: 0; }
        .option input:checked + .dot { background: var(--primary); box-shadow: 0 0 10px var(--primary); border-color: var(--primary); }

        .verbo-display {
            font-size: 2rem; font-weight: 800; color: var(--accent);
            margin: 15px 0; padding: 20px; background: rgba(0,0,0,0.4); 
            border-radius: 20px; border-left: 5px solid var(--accent);
        }

        input[type="text"] {
            width: 100%; padding: 18px; border-radius: 15px; border: 2px solid #30363d;
            background: #0d1117; color: white; font-size: 1.2rem; box-sizing: border-box; outline: none;
        }
        input[type="text"]:focus { border-color: var(--primary); }

        .btn-main {
            width: 100%; padding: 18px; margin-top: 20px; border: none; border-radius: 15px;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            color: #000; font-weight: 900; cursor: pointer; transition: 0.4s;
        }
        .btn-main:hover { transform: scale(1.02); box-shadow: 0 8px 20px rgba(0,242,254,0.3); }

        .feedback { margin-top: 15px; font-weight: bold; border-radius: 12px; padding: 15px; display: none; }
        .success { background: rgba(46, 204, 113, 0.15); color: var(--success); border: 1px solid var(--success); }
        .wrong { background: rgba(231, 76, 60, 0.15); color: var(--error); border: 1px solid var(--error); }
        
        .stat-badge { font-size: 0.8rem; color: var(--secondary); background: rgba(79, 172, 254, 0.1); padding: 5px 12px; border-radius: 20px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="setup-screen" class="glass-card">
        <h1>VERBOS PRO</h1>
        
        <div class="section-label">1. Analizar</div>
        <div class="filter-grid">
            <label class="option"><input type="checkbox" class="cat-check" value="persona" checked><span class="dot"></span> Persona</label>
            <label class="option"><input type="checkbox" class="cat-check" value="numero" checked><span class="dot"></span> Número</label>
            <label class="option"><input type="checkbox" class="cat-check" value="tiempo" checked><span class="dot"></span> Tiempo</label>
            <label class="option"><input type="checkbox" class="cat-check" value="modo"><span class="dot"></span> Modo</label>
            <label class="option"><input type="checkbox" class="cat-check" value="aspecto" checked><span class="dot"></span> Aspecto</label>
            <label class="option"><input type="checkbox" class="cat-check" value="voz"><span class="dot"></span> Voz</label>
        </div>

        <div class="section-label">2. Dificultad Real</div>
        <div class="difficulty-grid">
            <label class="option"><input type="radio" name="diff" value="basico" checked><span class="dot"></span> Básico</label>
            <label class="option"><input type="radio" name="diff" value="intermedio"><span class="dot"></span> Inter</label>
            <label class="option"><input type="radio" name="diff" value="avanzado"><span class="dot"></span> Pro</label>
        </div>

        <button class="btn-main" onclick="iniciarJuego()">COMENZAR DESAFÍO</button>
    </div>

    <div id="game-screen" class="glass-card" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span class="stat-badge">RACHA: <span id="racha">0</span></span>
            <span id="diff-tag" style="color: #58a6ff; font-weight: bold; font-size: 0.7rem;"></span>
        </div>
        
        <div id="frase-txt" style="color: #8b949e; font-size: 0.9rem;"></div>
        <div id="verbo-val" class="verbo-display"></div>
        <h3 id="pregunta-h" style="margin-bottom: 20px;"></h3>
        
        <input type="text" id="user-input" placeholder="Respuesta..." autocomplete="off">
        
        <button id="btn-submit" class="btn-main" onclick="verificarRespuesta()">COMPROBAR</button>
        
        <div id="feedback" class="feedback"></div>
        <button id="btn-next" class="btn-main" onclick="siguientePregunta()" style="display:none; background: #30363d; color: white;">SIGUIENTE</button>
    </div>
</div>

<script>
    const sujetos = [
        {txt: "Yo", p: "1a", n: "singular"}, {txt: "Tú", p: "2a", n: "singular"},
        {txt: "Él/Ella", p: "3a", n: "singular"}, {txt: "Nosotros", p: "1a", n: "plural"},
        {txt: "Vosotros", p: "2a", n: "plural"}, {txt: "Ellos/as", p: "3a", n: "plural"}
    ];

    // ASPECTOS: Imperfectivo (acción no acabada) / Perfectivo (acción acabada)
    const dbVerbos = {
        basico: [
            {inf: "hablar", conj: {"1a-singular": "hablo", "2a-singular": "hablas", "3a-singular": "habla", "1a-plural": "hablamos", "2a-plural": "habláis", "3a-plural": "hablan"}, t: "presente", asp: "imperfectivo"},
            {inf: "beber", conj: {"1a-singular": "bebo", "2a-singular": "bebes", "3a-singular": "bebe", "1a-plural": "bebemos", "2a-plural": "bebéis", "3a-plural": "beben"}, t: "presente", asp: "imperfectivo"},
            {inf: "cantar", conj: {"1a-singular": "canto", "2a-singular": "cantas", "3a-singular": "canta", "1a-plural": "cantamos", "2a-plural": "cantáis", "3a-plural": "cantan"}, t: "presente", asp: "imperfectivo"},
            {inf: "amar", conj: {"1a-singular": "amo", "2a-singular": "amas", "3a-singular": "ama", "1a-plural": "amamos", "2a-plural": "amáis", "3a-plural": "aman"}, t: "presente", asp: "imperfectivo"}
        ],
        intermedio: [
            {inf: "viajar", conj: {"1a-singular": "viajaré", "2a-singular": "viajarás", "3a-singular": "viajará", "1a-plural": "viajaremos", "2a-plural": "viajaréis", "3a-plural": "viajarán"}, t: "futuro simple", asp: "imperfectivo"},
            {inf: "correr", conj: {"1a-singular": "corrí", "2a-singular": "corriste", "3a-singular": "corrió", "1a-plural": "corrimos", "2a-plural": "corristeis", "3a-plural": "corrieron"}, t: "pretérito perfecto simple", asp: "perfectivo"},
            {inf: "escribir", conj: {"1a-singular": "escribía", "2a-singular": "escribías", "3a-singular": "escribía", "1a-plural": "escribíamos", "2a-plural": "escribíais", "3a-plural": "escribían"}, t: "pretérito imperfecto", asp: "imperfectivo"},
            {inf: "saltar", conj: {"1a-singular": "salté", "2a-singular": "saltaste", "3a-singular": "saltó", "1a-plural": "saltamos", "2a-plural": "saltasteis", "3a-plural": "saltaron"}, t: "pretérito perfecto simple", asp: "perfectivo"}
        ],
        avanzado: [
            {inf: "ir", conj: {"1a-singular": "fui", "2a-singular": "fuiste", "3a-singular": "fue", "1a-plural": "fuimos", "2a-plural": "fuisteis", "3a-plural": "fueron"}, t: "pretérito perfecto simple", asp: "perfectivo"},
            {inf: "ser", conj: {"1a-singular": "era", "2a-singular": "eras", "3a-singular": "era", "1a-plural": "éramos", "2a-plural": "erais", "3a-plural": "eran"}, t: "pretérito imperfecto", asp: "imperfectivo"},
            {inf: "saber", conj: {"1a-singular": "supe", "2a-singular": "supiste", "3a-singular": "supo", "1a-plural": "supimos", "2a-plural": "supisteis", "3a-plural": "supieron"}, t: "pretérito perfecto simple", asp: "perfectivo"},
            {inf: "decir", conj: {"1a-singular": "diré", "2a-singular": "dirás", "3a-singular": "dirá", "1a-plural": "diremos", "2a-plural": "diréis", "3a-plural": "dirán"}, t: "futuro simple", asp: "imperfectivo"},
            {inf: "traer", conj: {"1a-singular": "traje", "2a-singular": "trajiste", "3a-singular": "trajo", "1a-plural": "trajimos", "2a-plural": "trajisteis", "3a-plural": "trajeron"}, t: "pretérito perfecto simple", asp: "perfectivo"},
            {inf: "hacer", conj: {"1a-singular": "he hecho", "2a-singular": "has hecho", "3a-singular": "ha hecho", "1a-plural": "hemos hecho", "2a-plural": "habéis hecho", "3a-plural": "han hecho"}, t: "pretérito perfecto compuesto", asp: "perfectivo"}
        ]
    };

    let categoriasElegidas = [];
    let dificultadActual = "";
    let actual = {};
    let catObjetivo = "";
    let racha = 0;

    function iniciarJuego() {
        const checks = document.querySelectorAll(".cat-check:checked");
        categoriasElegidas = Array.from(checks).map(c => c.value);
        dificultadActual = document.querySelector('input[name="diff"]:checked').value;
        
        if (categoriasElegidas.length === 0) return alert("Selecciona al menos una categoría.");
        
        document.getElementById("setup-screen").style.display = "none";
        document.getElementById("game-screen").style.display = "block";
        document.getElementById("diff-tag").innerText = "MODO: " + dificultadActual.toUpperCase();
        siguientePregunta();
    }

    function siguientePregunta() {
        document.getElementById("feedback").style.display = "none";
        document.getElementById("btn-next").style.display = "none";
        document.getElementById("btn-submit").style.display = "block";
        const input = document.getElementById("user-input");
        input.value = ""; input.focus();
        
        const s = sujetos[Math.floor(Math.random() * sujetos.length)];
        const listaVerbos = dbVerbos[dificultadActual];
        const v = listaVerbos[Math.floor(Math.random() * listaVerbos.length)];
        const key = `${s.p}-${s.n}`;
        
        actual = { 
            persona: s.p, 
            numero: s.n, 
            tiempo: v.t, 
            modo: "indicativo",
            aspecto: v.asp,
            voz: "activa"
        };
        
        catObjetivo = categoriasElegidas[Math.floor(Math.random() * categoriasElegidas.length)];
        
        document.getElementById("frase-txt").innerText = `${s.txt} (${v.inf})...`;
        document.getElementById("verbo-val").innerText = v.conj[key];
        document.getElementById("pregunta-h").innerText = `¿Cuál es el ${catObjetivo.toUpperCase()}?`;
    }

    function verificarRespuesta() {
        const userAns = document.getElementById("user-input").value.toLowerCase().trim();
        const correctAns = actual[catObjetivo].toLowerCase();
        const fb = document.getElementById("feedback");
        fb.style.display = "block";
        
        if (userAns === correctAns) {
            fb.innerText = "✨ ¡CORRECTO!";
            fb.className = "feedback success";
            racha++;
        } else {
            fb.innerText = `❌ INCORRECTO. Era: ${correctAns}`;
            fb.className = "feedback wrong";
            racha = 0;
        }
        
        document.getElementById("racha").innerText = racha;
        document.getElementById("btn-submit").style.display = "none";
        document.getElementById("btn-next").style.display = "block";
    }

    document.getElementById("user-input").addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
            if (document.getElementById("btn-submit").style.display !== "none") verificarRespuesta();
            else siguientePregunta();
        }
    });
</script>
</body>
</html>
