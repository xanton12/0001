<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verbos</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: auto; background: #1a1a1a; padding: 30px; border-radius: 15px; border: 2px solid #333; }
        h1 { color: #00d4ff; text-transform: uppercase; letter-spacing: 2px; }
        .verb-card { background: #000; padding: 40px; border-radius: 10px; margin: 20px 0; border: 1px solid #00d4ff; }
        .word { font-size: 3.5rem; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .hint { color: #888; margin-bottom: 30px; font-style: italic; }
        .question { font-size: 1.5rem; color: #f1c40f; margin-bottom: 20px; }
        input { width: 80%; padding: 15px; font-size: 1.2rem; border-radius: 5px; border: none; margin-bottom: 20px; text-align: center; }
        button { padding: 15px 40px; font-size: 1.2rem; cursor: pointer; border: none; border-radius: 5px; transition: 0.3s; font-weight: bold; }
        .btn-check { background: #00d4ff; color: #000; }
        .btn-next { background: #333; color: #fff; display: none; }
        #feedback { margin: 20px; font-size: 1.3rem; font-weight: bold; padding: 15px; border-radius: 5px; display: none; }
        .score { font-size: 1.2rem; color: #00ff88; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Verbos</h1>
    <div class="score">Puntos: <span id="score">0</span></div>

    <div class="verb-card">
        <div id="hint" class="hint">Cargando...</div>
        <div id="word" class="word">---</div>
        <div id="question" class="question">---</div>
        <input type="text" id="ans" placeholder="Escribe tu respuesta..." autocomplete="off">
        <br>
        <button id="btn-check" class="btn-check" onclick="check()">Comprobar</button>
        <button id="btn-next" class="btn-next" onclick="next()">Siguiente Verbo</button>
    </div>
    
    <div id="feedback"></div>
</div>

<script>
    const data = [
        // INDICATIVO SIMPLES
        {inf: "Cantar", pal: "Canto", cat: "tiempo", res: "presente"},
        {inf: "Comer", pal: "Comía", cat: "tiempo", res: "pretérito imperfecto"},
        {inf: "Vivir", pal: "Viví", cat: "tiempo", res: "pretérito perfecto simple"},
        {inf: "Amar", pal: "Amaré", cat: "tiempo", res: "futuro simple"},
        {inf: "Temer", pal: "Temería", cat: "tiempo", res: "condicional simple"},

        // INDICATIVO COMPUESTOS
        {inf: "Partir", pal: "He partido", cat: "tiempo", res: "pretérito perfecto compuesto"},
        {inf: "Subir", pal: "Había subido", cat: "tiempo", res: "pretérito pluscuamperfecto"},
        {inf: "Hacer", pal: "Hube hecho", cat: "tiempo", res: "pretérito anterior"},
        {inf: "Decir", pal: "Habré dicho", cat: "tiempo", res: "futuro compuesto"},
        {inf: "Poner", pal: "Habría puesto", cat: "tiempo", res: "condicional compuesto"},

        // SUBJUNTIVO SIMPLES
        {inf: "Saltar", pal: "Salte", cat: "tiempo", res: "presente"},
        {inf: "Correr", pal: "Corriera", cat: "tiempo", res: "pretérito imperfecto"},
        {inf: "Dormir", pal: "Durmiese", cat: "tiempo", res: "pretérito imperfecto"},
        {inf: "Saber", pal: "Supiere", cat: "tiempo", res: "futuro simple"},

        // SUBJUNTIVO COMPUESTOS
        {inf: "Ir", pal: "Haya ido", cat: "tiempo", res: "pretérito perfecto compuesto"},
        {inf: "Venir", pal: "Hubiera venido", cat: "tiempo", res: "pretérito pluscuamperfecto"},
        {inf: "Traer", pal: "Hubiese traído", cat: "tiempo", res: "pretérito pluscuamperfecto"},
        {inf: "Caber", pal: "Hubiere cabido", cat: "tiempo", res: "futuro compuesto"},

        // IMPERATIVO
        {inf: "Mirar", pal: "Mira", cat: "modo", res: "imperativo"},
        {inf: "Escuchar", pal: "Escuchad", cat: "modo", res: "imperativo"},

        // FORMAS NO PERSONALES
        {inf: "Poder", pal: "Pudiendo", cat: "tiempo", res: "gerundio"},
        {inf: "Ver", pal: "Visto", cat: "tiempo", res: "participio"},
        {inf: "Estar", pal: "Estar", cat: "modo", res: "no personal"},
        {inf: "Haber", pal: "Habiendo", cat: "modo", res: "no personal"},

        // ACCIDENTES
        {inf: "Sentir", pal: "Sintamos", cat: "persona", res: "1a"},
        {inf: "Querer", pal: "Quieren", cat: "persona", res: "3a"},
        {inf: "Oír", pal: "Oyes", cat: "persona", res: "2a"},
        {inf: "Valer", pal: "Valemos", cat: "numero", res: "plural"},
        {inf: "Traducir", pal: "Traduje", cat: "numero", res: "singular"},
        {inf: "Romper", pal: "Roto", cat: "aspecto", res: "perfectivo"},
        {inf: "Pensar", pal: "Pensaba", cat: "aspecto", res: "imperfectivo"}
    ];

    let current = 0;
    let score = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    shuffle(data);

    function load() {
        if (current >= data.length) {
            alert("¡Has completado todos los verbos!");
            current = 0;
            shuffle(data);
        }
        const item = data[current];
        document.getElementById('hint').innerText = "Infinitivo: " + item.inf;
        document.getElementById('word').innerText = item.pal;
        document.getElementById('question').innerText = "¿Cuál es su " + item.cat.toUpperCase() + "?";
        document.getElementById('ans').value = "";
        document.getElementById('ans').disabled = false;
        document.getElementById('feedback').style.display = "none";
        document.getElementById('btn-check').style.display = "inline-block";
        document.getElementById('btn-next').style.display = "none";
        document.getElementById('ans').focus();
    }

    function check() {
        const user = document.getElementById('ans').value.toLowerCase().trim();
        const correct = data[current].res.toLowerCase();
        const f = document.getElementById('feedback');
        
        f.style.display = "block";
        if (user === correct) {
            f.innerText = "Respuesta correcta";
            f.style.background = "#00ff8822";
            f.style.color = "#00ff88";
            score += 10;
        } else {
            f.innerText = "La respuesta es: " + correct.toUpperCase();
            f.style.background = "#ff313122";
            f.style.color = "#ff3131";
        }

        document.getElementById('score').innerText = score;
        document.getElementById('ans').disabled = true;
        document.getElementById('btn-check').style.display = "none";
        document.getElementById('btn-next').style.display = "inline-block";
    }

    function next() {
        current++;
        load();
    }

    document.getElementById('ans').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') {
            if(document.getElementById('btn-check').style.display !== 'none') check();
            else next();
        }
    });

    load();
</script>
</body>
</html>
