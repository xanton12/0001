<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbos</title>
    <style>
        :root {
            --primary: #00f2fe; --secondary: #4facfe;
            --bg: #0b0e14; --card: #161b22;
            --text: #e6edf3; --accent: #f1c40f;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            margin: 0; display: flex; justify-content: center; min-height: 100vh;
        }
        .app-container {
            width: 100%; max-width: 500px; padding: 20px;
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass-card {
            background: var(--card); border-radius: 28px; padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05);
            text-align: center; position: relative;
        }
        h1 { background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.8rem; margin-top: 0; letter-spacing: -1px; }

        /* Filtros con "puntitos" */
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; text-align: left; }
        .option {
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px;
            display: flex; align-items: center; cursor: pointer; transition: 0.3s;
            border: 1px solid transparent;
        }
        .option:hover { background: rgba(255,255,255,0.08); }
        .option input { display: none; }
        .dot { height: 12px; width: 12px; border-radius: 50%; border: 2px solid var(--secondary); margin-right: 10px; display: inline-block; }
        .option input:checked + .dot { background: var(--primary); box-shadow: 0 0 10px var(--primary); }

        .verbo-display {
            font-size: 1.8rem; font-weight: 800; color: var(--accent);
            margin: 25px 0; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 15px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        input[type="text"] {
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #30363d;
            background: #0d1117; color: white; font-size: 1.1rem; box-sizing: border-box; outline: none;
        }
        input[type="text"]:focus { border-color: var(--primary); }

        .btn-main {
            width: 100%; padding: 18px; margin-top: 20px; border: none; border-radius: 15px;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            color: #000; font-weight: 900; cursor: pointer; transition: 0.4s;
        }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,242,254,0.4); }

        .feedback { margin-top: 20px; font-weight: bold; border-radius: 10px; padding: 15px; display: none; }
        .success { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .wrong { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="setup-screen" class="glass-card">
        <h1>Verbos</h1>
        <p style="color: #8b949e;">Personaliza tu práctica:</p>
        
        <div class="filter-grid">
            <label class="option"><input type="checkbox" class="cat-check" value="persona" checked><span class="dot"></span> Persona</label>
            <label class="option"><input type="checkbox" class="cat-check" value="numero" checked><span class="dot"></span> Número</label>
            <label class="option"><input type="checkbox" class="cat-check" value="tiempo" checked><span class="dot"></span> Tiempo</label>
            <label class="option"><input type="checkbox" class="cat-check" value="modo"><span class="dot"></span> Modo</label>
            <label class="option"><input type="checkbox" class="cat-check" value="aspecto"><span class="dot"></span> Aspecto</label>
            <label class="option"><input type="checkbox" class="cat-check" value="voz"><span class="dot"></span> Voz</label>
        </div>
        
        <button class="btn-main" onclick="iniciarJuego()">EMPEZAR</button>
    </div>

    <div id="game-screen" class="glass-card" style="display:none;">
        <div style="text-align: right; font-size: 0.8rem; color: var(--secondary); margin-bottom: 10px;">RACHA: <span id="racha">0</span></div>
        <div id="frase-txt" style="font-style: italic; color: #8b949e; min-height: 1.2em;"></div>
        <div id="verbo-val" class="verbo-display"></div>
        <h3 id="pregunta-h" style="margin-bottom: 20px;"></h3>
        
        <input type="text" id="user-input" placeholder="Escribe tu respuesta..." autocomplete="off">
        
        <button id="btn-submit" class="btn-main" onclick="verificarRespuesta()">COMPROBAR</button>
        
        <div id="feedback" class="feedback"></div>
        <button id="btn-next" class="btn-main" onclick="siguientePregunta()" style="display:none; background: #30363d; color: white;">SIGUIENTE</button>
    </div>
</div>

<script>
    // DATOS DEL JUEGO (Lógica de JavaScript)
    const sujetos = [
        {txt: "Ellas", p: "3a", n: "plural"},
        {txt: "Yo", p: "1a", n: "singular"},
        {txt: "Tú", p: "2a", n: "singular"},
        {txt: "Nosotros", p: "1a", n: "plural"},
        {txt: "Él", p: "3a", n: "singular"}
    ];

    const verbos = [
        {inf: "comer", conj: {"1a-singular": "como", "2a-singular": "comes", "3a-singular": "come", "1a-plural": "comemos", "3a-plural": "comen"}, t: "presente"},
        {inf: "viajar", conj: {"1a-singular": "viajaré", "2a-singular": "viajarás", "3a-singular": "viajará", "1a-plural": "viajaremos", "3a-plural": "viajarán"}, t: "futuro simple"},
        {inf: "vivir", conj: {"1a-singular": "viví", "2a-singular": "viviste", "3a-singular": "vivió", "1a-plural": "vivimos", "3a-plural": "vivieron"}, t: "pretérito perfecto"}
    ];

    let categoriasElegidas = [];
    let preguntaActual = {};
    let catObjetivo = "";
    let racha = 0;

    function iniciarJuego() {
        // Obtenemos qué "ticks" están marcados
        const checks = document.querySelectorAll(".cat-check:checked");
        categoriasElegidas = Array.from(checks).map(c => c.value);
        
        if (categoriasElegidas.length === 0) {
            alert("Por favor, selecciona al menos una categoría.");
            return;
        }

        document.getElementById("setup-screen").style.display = "none";
        document.getElementById("game-screen").style.display = "block";
        siguientePregunta();
    }

    function siguientePregunta() {
        // Limpiar interfaz
        document.getElementById("feedback").style.display = "none";
        document.getElementById("btn-next").style.display = "none";
        document.getElementById("btn-submit").style.display = "block";
        const input = document.getElementById("user-input");
        input.value = "";
        input.focus();
        
        // Seleccionar datos aleatorios
        const s = sujetos[Math.floor(Math.random() * sujetos.length)];
        const v = verbos[Math.floor(Math.random() * verbos.length)];
        const key = `${s.p}-${s.n}`;
        const verboConj = v.conj[key];
        
        preguntaActual = {
            persona: s.p,
            numero: s.n,
            tiempo: v.t,
            modo: "indicativo",
            aspecto: "imperfectivo",
            voz: "activa"
        };
        
        catObjetivo = categoriasElegidas[Math.floor(Math.random() * categoriasElegidas.length)];
        
        // Mostrar en pantalla
        document.getElementById("frase-txt").innerText = `Contexto: ${s.txt} ...`;
        document.getElementById("verbo-val").innerText = verboConj;
        document.getElementById("pregunta-h").innerText = `¿Cuál es el ${catObjetivo.toUpperCase()}?`;
    }

    function verificarRespuesta() {
        const input = document.getElementById("user-input");
        const userAns = input.value.toLowerCase().trim();
        const correctAns = preguntaActual[catObjetivo].toLowerCase();
        
        const fb = document.getElementById("feedback");
        fb.style.display = "block";
        
        if (userAns === correctAns) {
            fb.innerText = "✨ ¡Correcto! Eres un hacha.";
            fb.className = "feedback success";
            racha++;
        } else {
            fb.innerText = `❌ Error. La respuesta era: ${correctAns}`;
            fb.className = "feedback wrong";
            racha = 0;
        }
        
        document.getElementById("racha").innerText = racha;
        document.getElementById("btn-submit").style.display = "none";
        document.getElementById("btn-next").style.display = "block";
    }

    // Permitir usar la tecla "Enter" para enviar
    document.getElementById("user-input").addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
            if (document.getElementById("btn-submit").style.display !== "none") {
                verificarRespuesta();
            } else {
                siguientePregunta();
            }
        }
    });
</script>

</body>
</html>
